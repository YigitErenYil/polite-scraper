<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polite Scraper Dashboard</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; color: #222; }
  h1 { font-size: 1.4rem; }
  .stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ddd; }
  .stat span:first-child { color: #666; }
  .stat span:last-child { font-weight: bold; }
</style>
</head>
<body>
  <h1>Polite Scraper — Dashboard</h1>
  <div class="stat"><span>Record count</span><span>60</span></div>

  <div class="stat"><span>Failed pages (last run)</span><span>0</span></div>
  <div class="stat"><span>Invalid records (last run)</span><span>0</span></div>
  <div class="stat"><span>Data last refreshed</span><span>2026-09-16T13:18:24.041888Z</span></div>
  <div class="stat"><span>Last run duration</span><span>0.69s</span></div>
</body>
</html>
